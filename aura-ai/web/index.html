<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Aura</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="face"></canvas>
  <div id="caption"></div>
  <div id="hint">Say "Hey Aura", or press and hold anywhere to talk</div>

  <div id="trainPanel" class="panel-hidden">
    <div class="trainCard">
      <h2>Teach Aura your voice</h2>
      <p class="trainHelp">
        Record a handful of "Hey Aura", "Aura stop", and background-noise samples so Aura can
        learn to recognize your voice. Runs entirely on this phone — nothing is uploaded
        anywhere.
      </p>
      <button id="recordWake" class="trainBtnBig">Say "Hey Aura" (<span id="wakeCount">0</span>/15)</button>
      <button id="recordStop" class="trainBtnBig">Say "Aura Stop" (<span id="stopCount">0</span>/15)</button>
      <button id="recordNoise" class="trainBtnBig">Record background noise (<span id="noiseCount">0</span>/15)</button>
      <button id="trainBtn" class="trainBtnBig" disabled>Train</button>
      <p id="trainStatus" class="trainStatus"></p>
      <button id="skipTrain" class="trainSkip">Skip — use press-and-hold only</button>
    </div>
  </div>
  <button id="retrainLink" class="panel-hidden">retrain wake word</button>
  <button id="personaBtn">Aura</button>
  <button id="forgetBtn">forget everything</button>

  <!-- Tells the page which brain to use: the PC server, or OpenAI directly from the phone.
       Served by the Python server in server mode, or generated by the app in standalone. -->
  <script src="config.js"></script>
  <script src="direct.js"></script>
  <script src="native-audio.js"></script>
  <script src="tfjs/tfjs.min.js"></script>
  <script src="tfjs/speech-commands.min.js"></script>
  <script src="blazeface/blazeface.min.js"></script>
  <script src="face.js"></script>
  <script src="client.js"></script>
  <script src="presence.js"></script>
</body>
</html>
